name: OSV-Scanner

on:
  pull_request:
    branches: [devin/1734434668-add-drawing-program]
  merge_group:
    branches: [devin/1734434668-add-drawing-program]
  push:
    branches: [devin/1734434668-add-drawing-program]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    with:
      upload-sarif: false
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-scheduled:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      fail-on-vuln: false
      upload-sarif: false
    permissions:
      actions: read
      contents: read
      security-events: write
